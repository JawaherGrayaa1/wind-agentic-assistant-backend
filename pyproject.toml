[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-agentic-assistant"
version = "0.1.0"
description = "Open-source-first agentic ERP assistant MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "jinja2>=3.1,<4",
  "weasyprint>=62,<70",
  "vosk>=0.3.45,<1",
  "pydub>=0.25.1,<1",
  "pypdf>=4.0.0,<6",
  "pdfplumber>=0.11.0,<1",
  "reportlab>=4.0.0,<5",
  "pymupdf>=1.24.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
